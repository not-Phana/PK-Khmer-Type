<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=welcome.html">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Celestial Starlight Needle — 3D Interactive Cursor Pointer</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #webglCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      z-index: 1;
    }

    /* Ambient Starlight Vignette */
    .space-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, rgba(10, 14, 26, 0) 30%, rgba(0, 0, 0, 0.75) 85%, #000000 100%);
    }

    /* Subtle Celestial HUD */
    .hud-header {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 10;
      pointer-events: none;
    }

    .hud-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.08);
      border: 1px solid rgba(255, 209, 102, 0.35);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffd166;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px #ffd166;
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .hud-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-top: 6px;
      text-shadow: 0 0 20px rgba(255, 209, 102, 0.4);
    }

    .hud-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      max-width: 320px;
      line-height: 1.4;
    }

    /* Floating Navigation Controls */
    .hud-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(12, 16, 28, 0.82);
      border: 1px solid rgba(255, 209, 102, 0.25);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 16px rgba(255, 209, 102, 0.15);
    }

    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-btn:hover {
      background: rgba(255, 209, 102, 0.12);
      border-color: rgba(255, 209, 102, 0.35);
      color: #ffd166;
      transform: translateY(-1px);
    }

    .hud-btn.active {
      background: linear-gradient(135deg, rgba(255, 209, 102, 0.25), rgba(245, 158, 11, 0.15));
      border-color: #ffd166;
      color: #ffd166;
      box-shadow: 0 0 12px rgba(255, 209, 102, 0.3);
    }

    .hud-btn svg {
      stroke: currentColor;
    }

    /* Top Right Exit / App Link */
    .hud-top-right {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    .exit-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .exit-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
    }

    /* Telemetry Pill */
    .hud-telemetry {
      position: absolute;
      bottom: 24px;
      right: 28px;
      z-index: 10;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-align: right;
    }

    .hud-telemetry span {
      color: #ffd166;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- WebGL Three.js Canvas -->
  <canvas id="webglCanvas"></canvas>
  <div class="space-vignette"></div>

  <!-- Header Overlay -->
  <div class="hud-header">
    <div class="hud-title-row">
      <div class="hud-badge">
        <span class="pulse-dot"></span>
        <span>PK CELESTIAL POINTER</span>
      </div>
    </div>
    <h1 class="hud-title">Starlight Needle 3D</h1>
    <p class="hud-desc">Move your mouse to aim the 3D celestial lance. Click anywhere to discharge radiant starlight shockwaves.</p>
  </div>

  <!-- Top Right Navigation -->
  <div class="hud-top-right">
    <a href="index.html" class="exit-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Back to Studio</span>
    </a>
  </div>

  <!-- Bottom Navigation Dock -->
  <div class="hud-dock">
    <button type="button" class="hud-btn active" id="modeAimBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line></svg>
      <span>Aim At Cursor</span>
    </button>
    <button type="button" class="hud-btn" id="modeFollowBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 3 11 21 14 14 21 11 3 3"></polygon></svg>
      <span>Follow Cursor</span>
    </button>
    <button type="button" class="hud-btn" id="themeGoldBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      <span>Gold</span>
    </button>
    <button type="button" class="hud-btn" id="themeCyanBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle></svg>
      <span>Cyan</span>
    </button>
  </div>

  <!-- Telemetry HUD -->
  <div class="hud-telemetry">
    AIM PITCH: <span id="telPitch">0.0°</span>  YAW: <span id="telYaw">0.0°</span><br>
    COORDINATES: <span id="telCoords">0, 0</span>
  </div>

  <!-- Three.js (Local Offline Engine) -->
  <script src="Documents/three.min.js"></script>

  <script>
    (function () {
      'use strict';

      if (typeof THREE === 'undefined') {
        console.error('Three.js could not be loaded.');
        return;
      }

      const canvas = document.getElementById('webglCanvas');
      const telPitch = document.getElementById('telPitch');
      const telYaw = document.getElementById('telYaw');
      const telCoords = document.getElementById('telCoords');

      // Modes: 'aim' | 'follow'
      let currentMode = 'aim';
      let currentColorTheme = 'gold'; // 'gold' | 'cyan'

      const COLOR_PALETTES = {
        gold: {
          needle: 0xfef3c7,
          needleEmissive: 0xb45309,
          wings: 0x1e293b,
          wingEmissive: 0x451a03,
          wingBevel: 0xf59e0b,
          ring: 0xf59e0b,
          ruby: 0xdc2626,
          spark: 0xf59e0b
        },
        cyan: {
          needle: 0xf0f9ff,
          needleEmissive: 0x0284c7,
          wings: 0x0f172a,
          wingEmissive: 0x082f49,
          wingBevel: 0x38bdf8,
          ring: 0x38bdf8,
          ruby: 0x0284c7,
          spark: 0x38bdf8
        }
      };

      // Scene, Camera, Renderer
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0a0e17, 0.035);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 10.5);

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;

      // Warm, Natural Studio Lighting (Human Masterpiece Lighting)
      const ambientLight = new THREE.AmbientLight(0xfffbeb, 1.3);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
      keyLight.position.set(5, 7, 7);
      scene.add(keyLight);

      const warmFillLight = new THREE.DirectionalLight(0xfef3c7, 1.2);
      warmFillLight.position.set(-6, -3, 3);
      scene.add(warmFillLight);

      const rimLight = new THREE.DirectionalLight(0xf59e0b, 1.5);
      rimLight.position.set(0, -6, 4);
      scene.add(rimLight);

      const needleGlowLight = new THREE.PointLight(0xffd166, 2.2, 8);
      scene.add(needleGlowLight);

      // Subtle, Elegant Horological Glint Texture
      function createStarlightTexture(colorHex) {
        const cv = document.createElement('canvas');
        cv.width = 256;
        cv.height = 256;
        const ctx = cv.getContext('2d');
        const cx = 128, cy = 128;

        const radGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 110);
        radGrad.addColorStop(0, '#ffffff');
        radGrad.addColorStop(0.15, colorHex);
        radGrad.addColorStop(0.40, 'rgba(245, 158, 11, 0.25)');
        radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = radGrad;
        ctx.fillRect(0, 0, 256, 256);

        ctx.save();
        ctx.translate(cx, cy);

        const hGrad = ctx.createLinearGradient(-110, 0, 110, 0);
        hGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        hGrad.addColorStop(0.5, '#ffffff');
        hGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = hGrad;
        ctx.beginPath();
        ctx.moveTo(-110, 0);
        ctx.quadraticCurveTo(0, -4, 110, 0);
        ctx.quadraticCurveTo(0, 4, -110, 0);
        ctx.fill();

        const vGrad = ctx.createLinearGradient(0, -110, 0, 110);
        vGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        vGrad.addColorStop(0.5, '#ffffff');
        vGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = vGrad;
        ctx.beginPath();
        ctx.moveTo(0, -110);
        ctx.quadraticCurveTo(-4, 0, 0, 110);
        ctx.quadraticCurveTo(4, 0, 0, -110);
        ctx.fill();

        ctx.restore();

        const tex = new THREE.CanvasTexture(cv);
        tex.needsUpdate = true;
        return tex;
      }

      let starTextureGold = createStarlightTexture('#fbbf24');
      let starTextureCyan = createStarlightTexture('#38bdf8');

      // Root 3D Needle Lance Assembly (Artisan Horological Drafting Stylus)
      const needleAssembly = new THREE.Group();
      scene.add(needleAssembly);

      // 1. Precision Stylus Spine (Brushed Champagne Brass)
      const spineShape = new THREE.Shape();
      spineShape.moveTo(0, 4.8);
      spineShape.lineTo(0.04, 3.2);
      spineShape.lineTo(0.08, 1.6);
      spineShape.lineTo(0.14, 0.4);
      spineShape.lineTo(0.18, 0.0);
      spineShape.lineTo(0.14, -0.4);
      spineShape.lineTo(0.08, -1.6);
      spineShape.lineTo(0.04, -3.2);
      spineShape.lineTo(0, -4.6);
      spineShape.lineTo(-0.04, -3.2);
      spineShape.lineTo(-0.08, -1.6);
      spineShape.lineTo(-0.14, -0.4);
      spineShape.lineTo(-0.18, 0.0);
      spineShape.lineTo(-0.14, 0.4);
      spineShape.lineTo(-0.08, 1.6);
      spineShape.lineTo(-0.04, 3.2);
      spineShape.closePath();

      const spineGeo = new THREE.ExtrudeGeometry(spineShape, {
        depth: 0.10,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.03,
        bevelThickness: 0.03
      });
      spineGeo.center();

      const spineMat = new THREE.MeshPhysicalMaterial({
        color: 0xfef3c7,
        metalness: 0.88,
        roughness: 0.22,
        emissive: 0xb45309,
        emissiveIntensity: 0.35,
        clearcoat: 0.5,
        clearcoatRoughness: 0.08
      });
      const spineMesh = new THREE.Mesh(spineGeo, spineMat);
      needleAssembly.add(spineMesh);

      const spineEdges = new THREE.EdgesGeometry(spineGeo, 24);
      const spineEdgeMat = new THREE.LineBasicMaterial({
        color: 0xffedd5,
        linewidth: 1.5,
        transparent: true,
        opacity: 0.85
      });
      const spineEdgeLine = new THREE.LineSegments(spineEdges, spineEdgeMat);
      needleAssembly.add(spineEdgeLine);

      // 2. Sculpted Openwork Horological Wings
      const wingShape = new THREE.Shape();
      wingShape.moveTo(0, 0.45);
      wingShape.bezierCurveTo(0.5, 0.40, 1.2, 0.60, 2.5, 0.0);
      wingShape.bezierCurveTo(1.4, -0.45, 0.6, -0.35, 0, -0.45);
      wingShape.bezierCurveTo(-0.6, -0.35, -1.4, -0.45, -2.5, 0.0);
      wingShape.bezierCurveTo(-1.2, 0.60, -0.5, 0.40, 0, 0.45);
      wingShape.closePath();

      const rHole = new THREE.Path();
      rHole.moveTo(0.5, 0.12);
      rHole.bezierCurveTo(0.9, 0.22, 1.6, 0.10, 1.9, 0.0);
      rHole.bezierCurveTo(1.5, -0.10, 0.9, -0.12, 0.5, -0.05);
      rHole.closePath();
      wingShape.holes.push(rHole);

      const lHole = new THREE.Path();
      lHole.moveTo(-0.5, 0.12);
      lHole.bezierCurveTo(-0.9, 0.22, -1.6, 0.10, -1.9, 0.0);
      lHole.bezierCurveTo(-1.5, -0.10, -0.9, -0.12, -0.5, -0.05);
      lHole.closePath();
      wingShape.holes.push(lHole);

      const wingGeo = new THREE.ExtrudeGeometry(wingShape, {
        depth: 0.08,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.025,
        bevelThickness: 0.025
      });
      wingGeo.center();

      const wingMat = new THREE.MeshPhysicalMaterial({
        color: 0x1e293b,
        metalness: 0.90,
        roughness: 0.16,
        emissive: 0x451a03,
        emissiveIntensity: 0.25,
        clearcoat: 0.8,
        clearcoatRoughness: 0.05
      });
      const wingMesh = new THREE.Mesh(wingGeo, wingMat);
      needleAssembly.add(wingMesh);

      const wingEdges = new THREE.EdgesGeometry(wingGeo, 20);
      const wingEdgeMat = new THREE.LineBasicMaterial({
        color: 0xf59e0b,
        linewidth: 1.5,
        transparent: true,
        opacity: 0.90
      });
      const wingEdgeLine = new THREE.LineSegments(wingEdges, wingEdgeMat);
      needleAssembly.add(wingEdgeLine);

      // 3. Central Cabochon Ruby Pivot Jewel in Polished Bezel Setting
      const bezelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.14, 32);
      const bezelMat = new THREE.MeshPhysicalMaterial({
        color: 0xfde68a,
        metalness: 0.92,
        roughness: 0.15,
        clearcoat: 1.0
      });
      const bezel = new THREE.Mesh(bezelGeo, bezelMat);
      bezel.rotation.x = Math.PI / 2;
      needleAssembly.add(bezel);

      const rubyGeo = new THREE.SphereGeometry(0.22, 32, 16);
      const rubyMat = new THREE.MeshPhysicalMaterial({
        color: 0xdc2626,
        emissive: 0x991b1b,
        emissiveIntensity: 0.45,
        roughness: 0.06,
        metalness: 0.10,
        transmission: 0.65,
        clearcoat: 1.0
      });
      const rubyJewel = new THREE.Mesh(rubyGeo, rubyMat);
      rubyJewel.scale.set(1, 1, 0.45);
      needleAssembly.add(rubyJewel);

      // 4. Satin Brass Astrolabe Balance Ring with 4 Cardinal Studs
      const astrolabeRingGeo = new THREE.TorusGeometry(0.78, 0.016, 16, 64);
      const astrolabeRingMat = new THREE.MeshPhysicalMaterial({
        color: 0xf59e0b,
        metalness: 0.85,
        roughness: 0.22,
        clearcoat: 0.4
      });
      const astrolabeRing = new THREE.Mesh(astrolabeRingGeo, astrolabeRingMat);
      astrolabeRing.rotation.x = Math.PI / 4;
      needleAssembly.add(astrolabeRing);

      const studGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.08, 16);
      const studMat = new THREE.MeshPhysicalMaterial({
        color: 0xfef3c7,
        metalness: 0.95,
        roughness: 0.1
      });
      for (let i = 0; i < 4; i++) {
        const angle = (i / 4) * Math.PI * 2;
        const stud = new THREE.Mesh(studGeo, studMat);
        stud.position.set(Math.cos(angle) * 0.78, Math.sin(angle) * 0.78, 0);
        stud.rotation.z = angle;
        astrolabeRing.add(stud);
      }

      // 5. Stylus Tip & Tail Glints
      const tipFlareMat = new THREE.SpriteMaterial({
        map: starTextureGold,
        color: 0xffffff,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const tipFlare = new THREE.Sprite(tipFlareMat);
      tipFlare.position.set(0, 4.8, 0.1);
      tipFlare.scale.set(1.1, 1.1, 1);
      needleAssembly.add(tipFlare);

      const tailFlareMat = new THREE.SpriteMaterial({
        map: starTextureGold,
        color: 0xffffff,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const tailFlare = new THREE.Sprite(tailFlareMat);
      tailFlare.position.set(0, -4.6, 0.1);
      tailFlare.scale.set(0.85, 0.85, 1);
      needleAssembly.add(tailFlare);

      // 6. Ambient Dust Particles
      const particleCount = 120;
      const partGeo = new THREE.BufferGeometry();
      const partPositions = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        partPositions[i * 3 + 0] = (Math.random() - 0.5) * 16;
        partPositions[i * 3 + 1] = (Math.random() - 0.5) * 14;
        partPositions[i * 3 + 2] = (Math.random() - 0.5) * 8;
      }
      partGeo.setAttribute('position', new THREE.BufferAttribute(partPositions, 3));
      const partMat = new THREE.PointsMaterial({
        color: 0xf59e0b,
        size: 0.08,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending
      });
      const particleSystem = new THREE.Points(partGeo, partMat);
      scene.add(particleSystem);

      // 7. Tactile Click Ripples
      const ripples = [];

      function triggerShockwave(origin) {
        needleAssembly.updateMatrixWorld(true);
        const tipWorldPos = needleAssembly.localToWorld(new THREE.Vector3(0, 4.8, 0));

        const ringGeo = new THREE.RingGeometry(0.18, 0.28, 48);
        const ringMat = new THREE.MeshBasicMaterial({
          color: currentColorTheme === 'gold' ? 0xf59e0b : 0x38bdf8,
          transparent: true,
          opacity: 0.85,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending
        });
        const mesh = new THREE.Mesh(ringGeo, ringMat);
        mesh.position.copy(tipWorldPos);
        mesh.quaternion.copy(needleAssembly.quaternion);
        scene.add(mesh);

        ripples.push({ mesh, scale: 1, opacity: 0.85 });

        tipFlare.scale.set(1.9, 1.9, 1);
        needleGlowLight.intensity = 3.8;

        playCelestialChime();
      }

      /* Web Audio Synthesizer (Warm Mechanical Acoustic Chime) */
      let audioCtx = null;
      function playCelestialChime() {
        try {
          if (!audioCtx) {
            const AudioClass = window.AudioContext || window.webkitAudioContext;
            if (AudioClass) audioCtx = new AudioClass();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          if (!audioCtx) return;

          const now = audioCtx.currentTime;
          const freqs = [880, 1108.73, 1318.51, 1661.22, 1760];
          const masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(0.16, now);
          masterGain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
          masterGain.connect(audioCtx.destination);

          freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const voiceGain = audioCtx.createGain();
            osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.25);

            const vVol = 0.20 / (idx + 1);
            voiceGain.gain.setValueAtTime(vVol, now);
            voiceGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55 + idx * 0.05);

            osc.connect(voiceGain);
            voiceGain.connect(masterGain);

            osc.start(now + idx * 0.015);
            osc.stop(now + 0.65);
          });
        } catch (_e) {}
      }

      /* Mouse Cursor Tracking & 3D Aiming Engine */
      const mouse = {
        screenX: window.innerWidth / 2,
        screenY: window.innerHeight / 2,
        ndcX: 0,
        ndcY: 0,
        worldX: 0,
        worldY: 0,
        isDown: false
      };

      const needleState = {
        pos: new THREE.Vector3(0, 0, 0),
        targetPos: new THREE.Vector3(0, 0, 0),
        vel: new THREE.Vector3(0, 0, 0),
        currentQuat: new THREE.Quaternion(),
        targetQuat: new THREE.Quaternion()
      };

      function updateWorldMouseCoords(clientX, clientY) {
        mouse.screenX = clientX;
        mouse.screenY = clientY;
        mouse.ndcX = (clientX / window.innerWidth) * 2 - 1;
        mouse.ndcY = -(clientY / window.innerHeight) * 2 + 1;

        const vec = new THREE.Vector3(mouse.ndcX, mouse.ndcY, 0.5);
        vec.unproject(camera);
        vec.sub(camera.position).normalize();
        const distance = -camera.position.z / vec.z;
        const worldPos = camera.position.clone().add(vec.multiplyScalar(distance));

        mouse.worldX = worldPos.x;
        mouse.worldY = worldPos.y;

        if (telCoords) {
          telCoords.textContent = `${Math.round(clientX)}, ${Math.round(clientY)}`;
        }
      }

      window.addEventListener('pointermove', function (e) {
        updateWorldMouseCoords(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('pointerdown', function (e) {
        mouse.isDown = true;
        updateWorldMouseCoords(e.clientX, e.clientY);
        triggerShockwave(needleAssembly.position);
      });

      window.addEventListener('pointerup', function () {
        mouse.isDown = false;
      });

      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /* Main Animation & Physics Loop */
      let clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const time = clock.getElapsedTime();

        // 1. Aiming / Following Logic
        if (currentMode === 'aim') {
          needleState.targetPos.set(0, 0, 0);

          const targetDir = new THREE.Vector3(mouse.worldX, mouse.worldY, 0).sub(needleAssembly.position);
          targetDir.z = Math.min(2.2, Math.max(-2.2, targetDir.length() * 0.12));
          targetDir.normalize();

          const upVector = new THREE.Vector3(0, 1, 0);
          needleState.targetQuat.setFromUnitVectors(upVector, targetDir);

          needleState.targetPos.y += Math.sin(time * 1.6) * 0.08;

          needleAssembly.quaternion.slerp(needleState.targetQuat, 0.08);
          needleAssembly.position.lerp(needleState.targetPos, 0.08);

          const euler = new THREE.Euler().setFromQuaternion(needleAssembly.quaternion);
          if (telPitch) telPitch.textContent = `${(euler.x * 57.2958).toFixed(1)}°`;
          if (telYaw) telYaw.textContent = `${(euler.z * 57.2958).toFixed(1)}°`;

        } else if (currentMode === 'follow') {
          const offset = new THREE.Vector3(mouse.worldX, mouse.worldY, 0.5);
          needleState.targetPos.copy(offset);

          const moveDir = needleState.targetPos.clone().sub(needleAssembly.position);
          const speed = moveDir.length();
          moveDir.normalize();

          if (speed > 0.05) {
            needleState.targetQuat.setFromUnitVectors(new THREE.Vector3(0, 1, 0), moveDir);
            needleAssembly.quaternion.slerp(needleState.targetQuat, 0.1);
          }

          needleAssembly.position.lerp(needleState.targetPos, 0.12);
        }

        // 2. Smooth Slow Astrolabe Rotation
        astrolabeRing.rotation.z += 0.008;

        // 3. Relax Tip Flare & Light Intensity
        if (tipFlare.scale.x > 1.1) {
          const nextScale = Math.max(1.1, tipFlare.scale.x - delta * 2.8);
          tipFlare.scale.set(nextScale, nextScale, 1);
        }
        if (needleGlowLight.intensity > 2.2) {
          needleGlowLight.intensity = Math.max(2.2, needleGlowLight.intensity - delta * 3.5);
        }

        // 4. Update Click Ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          r.scale += delta * 4.2;
          r.opacity -= delta * 1.8;
          r.mesh.scale.set(r.scale, r.scale, r.scale);
          r.mesh.material.opacity = Math.max(0, r.opacity);
          if (r.opacity <= 0) {
            scene.remove(r.mesh);
            r.mesh.geometry.dispose();
            r.mesh.material.dispose();
            ripples.splice(i, 1);
          }
        }

        needleGlowLight.position.copy(needleAssembly.position);

        renderer.render(scene, camera);
      }

      animate();

      /* HUD Controls Interaction */
      const modeAimBtn = document.getElementById('modeAimBtn');
      const modeFollowBtn = document.getElementById('modeFollowBtn');
      const themeGoldBtn = document.getElementById('themeGoldBtn');
      const themeCyanBtn = document.getElementById('themeCyanBtn');

      function setMode(mode) {
        currentMode = mode;
        modeAimBtn.classList.toggle('active', mode === 'aim');
        modeFollowBtn.classList.toggle('active', mode === 'follow');
      }

      function setTheme(theme) {
        currentColorTheme = theme;
        themeGoldBtn.classList.toggle('active', theme === 'gold');
        themeCyanBtn.classList.toggle('active', theme === 'cyan');

        const palette = COLOR_PALETTES[theme];
        spineMat.color.setHex(palette.needle);
        spineMat.emissive.setHex(palette.needleEmissive);
        wingMat.color.setHex(palette.wings);
        wingMat.emissive.setHex(palette.wingEmissive);
        wingEdgeMat.color.setHex(palette.wingBevel);
        astrolabeRingMat.color.setHex(palette.ring);
        rubyMat.color.setHex(palette.ruby);
        needleGlowLight.color.setHex(palette.spark);
        particleSystem.material.color.setHex(palette.spark);

        const tex = theme === 'gold' ? starTextureGold : starTextureCyan;
        tipFlare.material.map = tex;
        tailFlare.material.map = tex;
      }

      modeAimBtn.addEventListener('click', () => setMode('aim'));
      modeFollowBtn.addEventListener('click', () => setMode('follow'));
      themeGoldBtn.addEventListener('click', () => setTheme('gold'));
      themeCyanBtn.addEventListener('click', () => setTheme('cyan'));

    })();
  </script>
</body>
</html>

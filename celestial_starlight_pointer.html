<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=welcome.html">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Celestial Starlight Needle — 3D Interactive Cursor Pointer</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #webglCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      z-index: 1;
    }

    /* Ambient Starlight Vignette */
    .space-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, rgba(10, 14, 26, 0) 30%, rgba(0, 0, 0, 0.75) 85%, #000000 100%);
    }

    /* Subtle Celestial HUD */
    .hud-header {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 10;
      pointer-events: none;
    }

    .hud-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.08);
      border: 1px solid rgba(255, 209, 102, 0.35);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffd166;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px #ffd166;
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .hud-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-top: 6px;
      text-shadow: 0 0 20px rgba(255, 209, 102, 0.4);
    }

    .hud-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      max-width: 320px;
      line-height: 1.4;
    }

    /* Floating Navigation Controls */
    .hud-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(12, 16, 28, 0.82);
      border: 1px solid rgba(255, 209, 102, 0.25);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 16px rgba(255, 209, 102, 0.15);
    }

    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-btn:hover {
      background: rgba(255, 209, 102, 0.12);
      border-color: rgba(255, 209, 102, 0.35);
      color: #ffd166;
      transform: translateY(-1px);
    }

    .hud-btn.active {
      background: linear-gradient(135deg, rgba(255, 209, 102, 0.25), rgba(245, 158, 11, 0.15));
      border-color: #ffd166;
      color: #ffd166;
      box-shadow: 0 0 12px rgba(255, 209, 102, 0.3);
    }

    .hud-btn svg {
      stroke: currentColor;
    }

    /* Top Right Exit / App Link */
    .hud-top-right {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    .exit-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .exit-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
    }

    /* Telemetry Pill */
    .hud-telemetry {
      position: absolute;
      bottom: 24px;
      right: 28px;
      z-index: 10;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-align: right;
    }

    .hud-telemetry span {
      color: #ffd166;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- WebGL Three.js Canvas -->
  <canvas id="webglCanvas"></canvas>
  <div class="space-vignette"></div>

  <!-- Header Overlay -->
  <div class="hud-header">
    <div class="hud-title-row">
      <div class="hud-badge">
        <span class="pulse-dot"></span>
        <span>PK CELESTIAL POINTER</span>
      </div>
    </div>
    <h1 class="hud-title">Starlight Needle 3D</h1>
    <p class="hud-desc">Move your mouse to aim the 3D celestial lance. Click anywhere to discharge radiant starlight shockwaves.</p>
  </div>

  <!-- Top Right Navigation -->
  <div class="hud-top-right">
    <a href="index.html" class="exit-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Back to Studio</span>
    </a>
  </div>

  <!-- Bottom Navigation Dock -->
  <div class="hud-dock">
    <button type="button" class="hud-btn active" id="modeAimBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line></svg>
      <span>Aim At Cursor</span>
    </button>
    <button type="button" class="hud-btn" id="modeFollowBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 3 11 21 14 14 21 11 3 3"></polygon></svg>
      <span>Follow Cursor</span>
    </button>
    <button type="button" class="hud-btn" id="themeGoldBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      <span>Gold</span>
    </button>
    <button type="button" class="hud-btn" id="themeCyanBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle></svg>
      <span>Cyan</span>
    </button>
  </div>

  <!-- Telemetry HUD -->
  <div class="hud-telemetry">
    AIM PITCH: <span id="telPitch">0.0°</span>  YAW: <span id="telYaw">0.0°</span><br>
    COORDINATES: <span id="telCoords">0, 0</span>
  </div>

  <!-- Three.js (Local Offline Engine) -->
  <script src="Documents/three.min.js"></script>

  <script>
    (function () {
      'use strict';

      if (typeof THREE === 'undefined') {
        console.error('Three.js could not be loaded.');
        return;
      }

      const canvas = document.getElementById('webglCanvas');
      const telPitch = document.getElementById('telPitch');
      const telYaw = document.getElementById('telYaw');
      const telCoords = document.getElementById('telCoords');

      // Modes: 'aim' | 'follow'
      let currentMode = 'aim';
      let currentColorTheme = 'gold'; // 'gold' | 'cyan'

      const COLOR_PALETTES = {
        gold: {
          needle: 0xffffff,
          needleEmissive: 0xd4a017,
          wings: 0x141b2d,
          wingEmissive: 0xc89618,
          wingBevel: 0xfff0a0,
          crystalWing: 0xffe28a,
          ring1: 0xffd166,
          ring2: 0x67e8f9,
          ring3: 0xffffff,
          coreGlow: '#ffd166',
          accentLight: 0xffe28a,
          spark: 0xffd166
        },
        cyan: {
          needle: 0xf0f9ff,
          needleEmissive: 0x38bdf8,
          wings: 0x0c1e33,
          wingEmissive: 0x0284c7,
          wingBevel: 0xbae6fd,
          crystalWing: 0x7dd3fc,
          ring1: 0x38bdf8,
          ring2: 0x818cf8,
          ring3: 0xffffff,
          coreGlow: '#38bdf8',
          accentLight: 0x7dd3fc,
          spark: 0x38bdf8
        }
      };

      // Scene, Camera, Renderer
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.030);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 11);

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;

      // Lighting (Warm Stellar Key + Deep Cosmic Rim + Pulsar Point)
      const ambientLight = new THREE.AmbientLight(0xfff8e7, 1.5);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
      keyLight.position.set(5, 8, 8);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0xffd166, 3.2);
      rimLight.position.set(-6, -4, 4);
      scene.add(rimLight);

      const cyanBackLight = new THREE.DirectionalLight(0x38bdf8, 1.8);
      cyanBackLight.position.set(3, -5, -4);
      scene.add(cyanBackLight);

      const needleGlowLight = new THREE.PointLight(0xffd166, 3.8, 9);
      scene.add(needleGlowLight);

      // Procedural High-Dynamic-Range 8-Point Diamond Starburst Texture (512x512)
      function createStarlightTexture(colorHex, secondaryHex) {
        const cv = document.createElement('canvas');
        cv.width = 512;
        cv.height = 512;
        const ctx = cv.getContext('2d');
        const cx = 256, cy = 256;

        // Radial diffuse halo
        const radGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 240);
        radGrad.addColorStop(0, '#ffffff');
        radGrad.addColorStop(0.08, colorHex);
        radGrad.addColorStop(0.25, secondaryHex || 'rgba(255, 209, 102, 0.45)');
        radGrad.addColorStop(0.55, 'rgba(255, 160, 32, 0.12)');
        radGrad.addColorStop(0.85, 'rgba(120, 60, 255, 0.03)');
        radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = radGrad;
        ctx.fillRect(0, 0, 512, 512);

        ctx.save();
        ctx.translate(cx, cy);

        // Horizontal ray
        const hGrad = ctx.createLinearGradient(-240, 0, 240, 0);
        hGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        hGrad.addColorStop(0.46, 'rgba(255, 245, 200, 0.85)');
        hGrad.addColorStop(0.5, '#ffffff');
        hGrad.addColorStop(0.54, 'rgba(255, 245, 200, 0.85)');
        hGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = hGrad;
        ctx.beginPath();
        ctx.moveTo(-240, 0);
        ctx.quadraticCurveTo(0, -9, 240, 0);
        ctx.quadraticCurveTo(0, 9, -240, 0);
        ctx.fill();

        // Vertical ray
        const vGrad = ctx.createLinearGradient(0, -240, 0, 240);
        vGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        vGrad.addColorStop(0.46, 'rgba(255, 245, 200, 0.85)');
        vGrad.addColorStop(0.5, '#ffffff');
        vGrad.addColorStop(0.54, 'rgba(255, 245, 200, 0.85)');
        vGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = vGrad;
        ctx.beginPath();
        ctx.moveTo(0, -240);
        ctx.quadraticCurveTo(-9, 0, 0, 240);
        ctx.quadraticCurveTo(9, 0, 0, -240);
        ctx.fill();

        // Diagonal diamond core
        ctx.rotate(Math.PI / 4);
        const dGrad = ctx.createLinearGradient(-130, 0, 130, 0);
        dGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        dGrad.addColorStop(0.5, '#ffffff');
        dGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = dGrad;
        ctx.beginPath();
        ctx.moveTo(-130, 0);
        ctx.quadraticCurveTo(0, -5, 130, 0);
        ctx.quadraticCurveTo(0, 5, -130, 0);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, -130);
        ctx.quadraticCurveTo(-5, 0, 0, 130);
        ctx.quadraticCurveTo(5, 0, 0, -130);
        ctx.fill();

        ctx.restore();

        const tex = new THREE.CanvasTexture(cv);
        tex.needsUpdate = true;
        return tex;
      }

      let starTextureGold = createStarlightTexture('#ffd166', 'rgba(255, 209, 102, 0.50)');
      let starTextureCyan = createStarlightTexture('#38bdf8', 'rgba(103, 232, 249, 0.50)');

      // Root 3D Needle Lance Assembly
      const needleAssembly = new THREE.Group();
      scene.add(needleAssembly);

      // 1. Faceted Tapered Double-Diamond Needle Spine
      const spineShape = new THREE.Shape();
      spineShape.moveTo(0, 5.2);
      spineShape.lineTo(0.045, 3.4);
      spineShape.lineTo(0.09, 1.8);
      spineShape.lineTo(0.16, 0.45);
      spineShape.lineTo(0.22, 0.0);
      spineShape.lineTo(0.16, -0.45);
      spineShape.lineTo(0.09, -1.8);
      spineShape.lineTo(0.045, -3.4);
      spineShape.lineTo(0, -5.0);
      spineShape.lineTo(-0.045, -3.4);
      spineShape.lineTo(-0.09, -1.8);
      spineShape.lineTo(-0.16, -0.45);
      spineShape.lineTo(-0.22, 0.0);
      spineShape.lineTo(-0.16, 0.45);
      spineShape.lineTo(-0.09, 1.8);
      spineShape.lineTo(-0.045, 3.4);
      spineShape.closePath();

      const spineGeo = new THREE.ExtrudeGeometry(spineShape, {
        depth: 0.12,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.035,
        bevelThickness: 0.035
      });
      spineGeo.center();

      const spineMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.95,
        roughness: 0.08,
        emissive: 0xd4a017,
        emissiveIntensity: 0.55,
        clearcoat: 1.0,
        clearcoatRoughness: 0.03
      });
      const spineMesh = new THREE.Mesh(spineGeo, spineMat);
      needleAssembly.add(spineMesh);

      // Spine Razor Contour Edges
      const spineEdges = new THREE.EdgesGeometry(spineGeo, 24);
      const spineEdgeMat = new THREE.LineBasicMaterial({
        color: 0xfff3a8,
        linewidth: 2,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });
      const spineEdgeLine = new THREE.LineSegments(spineEdges, spineEdgeMat);
      needleAssembly.add(spineEdgeLine);

      // Central Laser Core Rod
      const coreRodGeo = new THREE.CylinderGeometry(0.022, 0.022, 10.2, 8);
      const coreRodMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const coreRodMesh = new THREE.Mesh(coreRodGeo, coreRodMat);
      needleAssembly.add(coreRodMesh);

      // 2. Multi-Tiered Seraph Wing Array (Obsidian Damascus + Crystalline Winglets)
      const wingShape = new THREE.Shape();
      wingShape.moveTo(0, 0.50);
      wingShape.lineTo(0.40, 0.42);
      wingShape.lineTo(0.95, 0.85);
      wingShape.lineTo(1.15, 0.45);
      wingShape.lineTo(1.85, 0.38);
      wingShape.lineTo(3.05, 0.0);
      wingShape.lineTo(1.90, -0.25);
      wingShape.lineTo(1.20, -0.32);
      wingShape.lineTo(0.85, -0.65);
      wingShape.lineTo(0.40, -0.40);
      wingShape.lineTo(0, -0.50);
      wingShape.lineTo(-0.40, -0.40);
      wingShape.lineTo(-0.85, -0.65);
      wingShape.lineTo(-1.20, -0.32);
      wingShape.lineTo(-1.90, -0.25);
      wingShape.lineTo(-3.05, 0.0);
      wingShape.lineTo(-1.85, 0.38);
      wingShape.lineTo(-1.15, 0.45);
      wingShape.lineTo(-0.95, 0.85);
      wingShape.lineTo(-0.40, 0.42);
      wingShape.closePath();

      const wingGeo = new THREE.ExtrudeGeometry(wingShape, {
        depth: 0.10,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.03,
        bevelThickness: 0.03
      });
      wingGeo.center();

      const wingMat = new THREE.MeshPhysicalMaterial({
        color: 0x141b2d,
        metalness: 0.95,
        roughness: 0.12,
        emissive: 0xc89618,
        emissiveIntensity: 0.58,
        clearcoat: 1.0,
        clearcoatRoughness: 0.04
      });
      const wingMesh = new THREE.Mesh(wingGeo, wingMat);
      needleAssembly.add(wingMesh);

      const wingEdges = new THREE.EdgesGeometry(wingGeo, 20);
      const wingEdgeMat = new THREE.LineBasicMaterial({
        color: 0xfff0a0,
        linewidth: 2,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });
      const wingEdgeLine = new THREE.LineSegments(wingEdges, wingEdgeMat);
      needleAssembly.add(wingEdgeLine);

      // Floating Inner Crystalline Winglets
      const crystalWingShape = new THREE.Shape();
      crystalWingShape.moveTo(0.25, 0.30);
      crystalWingShape.lineTo(0.70, 0.55);
      crystalWingShape.lineTo(1.50, 0.22);
      crystalWingShape.lineTo(0.70, -0.22);
      crystalWingShape.lineTo(0.25, -0.15);
      crystalWingShape.closePath();

      const crystalWingGeo = new THREE.ExtrudeGeometry(crystalWingShape, {
        depth: 0.04,
        bevelEnabled: true,
        bevelSegments: 1,
        bevelSize: 0.02,
        bevelThickness: 0.02
      });
      crystalWingGeo.center();

      const crystalWingMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.15,
        roughness: 0.05,
        transmission: 0.55,
        emissive: 0xffe28a,
        emissiveIntensity: 0.85,
        transparent: true,
        opacity: 0.88
      });

      const rCrystalWing = new THREE.Mesh(crystalWingGeo, crystalWingMat);
      rCrystalWing.position.set(0.85, 0.12, 0.07);
      needleAssembly.add(rCrystalWing);

      const lCrystalWing = new THREE.Mesh(crystalWingGeo, crystalWingMat);
      lCrystalWing.position.set(-0.85, 0.12, 0.07);
      lCrystalWing.rotation.y = Math.PI;
      needleAssembly.add(lCrystalWing);

      // Rune Inlays
      const rWingInlay = [
        new THREE.Vector3(0.3, 0.22, 0.065),
        new THREE.Vector3(0.85, 0.55, 0.065),
        new THREE.Vector3(1.1, 0.30, 0.065),
        new THREE.Vector3(1.8, 0.24, 0.065),
        new THREE.Vector3(2.7, 0.0, 0.065),
        new THREE.Vector3(1.7, -0.16, 0.065),
        new THREE.Vector3(1.0, -0.20, 0.065),
        new THREE.Vector3(0.65, -0.42, 0.065),
        new THREE.Vector3(0.3, -0.22, 0.065)
      ];
      const lWingInlay = rWingInlay.map(p => new THREE.Vector3(-p.x, p.y, p.z));

      const inlayMat = new THREE.LineBasicMaterial({
        color: 0xfff6d0,
        transparent: true,
        opacity: 0.88,
        blending: THREE.AdditiveBlending
      });
      const rWingLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(rWingInlay), inlayMat);
      const lWingLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(lWingInlay), inlayMat);
      needleAssembly.add(rWingLine);
      needleAssembly.add(lWingLine);

      // Diamond Star Nodes on Wing Tips & Barbs
      const wingGemGeo = new THREE.OctahedronGeometry(0.13, 0);
      const wingGemMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const rTipGem = new THREE.Mesh(wingGemGeo, wingGemMat);
      rTipGem.position.set(3.05, 0, 0.08);
      const lTipGem = new THREE.Mesh(wingGemGeo, wingGemMat);
      lTipGem.position.set(-3.05, 0, 0.08);
      const rBarbGem = new THREE.Mesh(wingGemGeo, wingGemMat);
      rBarbGem.position.set(0.95, 0.85, 0.08);
      const lBarbGem = new THREE.Mesh(wingGemGeo, wingGemMat);
      lBarbGem.position.set(-0.95, 0.85, 0.08);
      needleAssembly.add(rTipGem);
      needleAssembly.add(lTipGem);
      needleAssembly.add(rBarbGem);
      needleAssembly.add(lBarbGem);

      // 3. Triple Concentric Counter-Rotating Astrolabe Gimbal Rings
      const ringGeo1 = new THREE.TorusGeometry(0.72, 0.018, 16, 64);
      const ringMat1 = new THREE.MeshBasicMaterial({
        color: 0xffd166,
        transparent: true,
        opacity: 0.90,
        blending: THREE.AdditiveBlending
      });
      const gimbalRing1 = new THREE.Mesh(ringGeo1, ringMat1);
      gimbalRing1.rotation.x = Math.PI / 3;
      needleAssembly.add(gimbalRing1);

      const studGeo = new THREE.OctahedronGeometry(0.065, 0);
      const studMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const studs = [];
      for(let i = 0; i < 4; i++){
        const angle = (i / 4) * Math.PI * 2;
        const stud = new THREE.Mesh(studGeo, studMat);
        stud.position.set(Math.cos(angle) * 0.72, Math.sin(angle) * 0.72, 0);
        gimbalRing1.add(stud);
        studs.push(stud);
      }

      const ringGeo2 = new THREE.TorusGeometry(0.90, 0.015, 16, 64);
      const ringMat2 = new THREE.MeshBasicMaterial({
        color: 0x67e8f9,
        transparent: true,
        opacity: 0.80,
        blending: THREE.AdditiveBlending
      });
      const gimbalRing2 = new THREE.Mesh(ringGeo2, ringMat2);
      gimbalRing2.rotation.y = Math.PI / 4;
      needleAssembly.add(gimbalRing2);

      const ringGeo3 = new THREE.TorusGeometry(0.52, 0.013, 14, 48);
      const ringMat3 = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending
      });
      const gimbalRing3 = new THREE.Mesh(ringGeo3, ringMat3);
      gimbalRing3.rotation.x = -Math.PI / 5;
      needleAssembly.add(gimbalRing3);

      // Dual-Nested Octahedron Diamond Crystal Core
      const innerDiamondGeo = new THREE.OctahedronGeometry(0.24, 0);
      const innerDiamondMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const innerDiamond = new THREE.Mesh(innerDiamondGeo, innerDiamondMat);

      const outerDiamondGeo = new THREE.OctahedronGeometry(0.36, 0);
      const outerDiamondMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        emissive: 0xffd166,
        emissiveIntensity: 0.9,
        roughness: 0.04,
        metalness: 0.95,
        clearcoat: 1.0,
        transparent: true,
        opacity: 0.85
      });
      const outerDiamond = new THREE.Mesh(outerDiamondGeo, outerDiamondMat);
      outerDiamond.add(innerDiamond);
      needleAssembly.add(outerDiamond);

      // 4. The 5 Pulsing Starlight Novas Along Axis
      const starSprites = [];
      const starGems = [];
      const starYPositions = [2.7, 1.35, 0.0, -1.35, -2.7];
      const starScales = [1.45, 1.75, 2.9, 1.75, 1.45];

      starYPositions.forEach((yPos, idx) => {
        const mat = new THREE.SpriteMaterial({
          map: idx === 2 ? starTextureGold : (idx % 2 === 0 ? starTextureGold : starTextureCyan),
          color: 0xffffff,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(mat);
        sprite.position.set(0, yPos, 0.1);
        sprite.scale.set(starScales[idx], starScales[idx], 1);
        needleAssembly.add(sprite);
        starSprites.push({ sprite, baseScale: starScales[idx], phase: idx * 0.85 });

        if (idx !== 2) {
          const gemGeo = new THREE.OctahedronGeometry(0.13, 0);
          const gemMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
          const gemMesh = new THREE.Mesh(gemGeo, gemMat);
          gemMesh.position.set(0, yPos, 0.08);
          needleAssembly.add(gemMesh);
          starGems.push(gemMesh);
        }
      });

      // Summit Razor Tip Beacon Flare
      const tipFlareMat = new THREE.SpriteMaterial({
        map: starTextureGold,
        color: 0xffffff,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const tipFlare = new THREE.Sprite(tipFlareMat);
      tipFlare.position.set(0, 5.15, 0.1);
      tipFlare.scale.set(1.3, 1.3, 1);
      needleAssembly.add(tipFlare);

      // Tail Counterweight Star Flare
      const tailFlareMat = new THREE.SpriteMaterial({
        map: starTextureGold,
        color: 0xffffff,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const tailFlare = new THREE.Sprite(tailFlareMat);
      tailFlare.position.set(0, -4.95, 0.1);
      tailFlare.scale.set(1.0, 1.0, 1);
      needleAssembly.add(tailFlare);

      // 5. Orbiting Celestial Satellites (Starlight Motes)
      const motes = [
        { rx: 1.8, ry: 1.4, rz: 1.2, speed: 1.6, tilt: 0.6, angle: 0, color: 0xffd166 },
        { rx: 2.3, ry: 1.7, rz: 1.5, speed: -1.3, tilt: -0.7, angle: Math.PI * 0.5, color: 0x38bdf8 },
        { rx: 1.4, ry: 2.0, rz: 1.0, speed: 2.1, tilt: 1.3, angle: Math.PI, color: 0xffffff },
        { rx: 2.8, ry: 1.2, rz: 1.4, speed: -1.8, tilt: 0.3, angle: Math.PI * 1.5, color: 0xffe28a }
      ];
      motes.forEach(m => {
        const sMat = new THREE.SpriteMaterial({
          map: m.color === 0x38bdf8 ? starTextureCyan : starTextureGold,
          color: 0xffffff,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const sMesh = new THREE.Sprite(sMat);
        sMesh.scale.set(0.45, 0.45, 1);
        needleAssembly.add(sMesh);
        m.sprite = sMesh;
      });

      // 6. Dual Dynamic Electrical Plasma Filaments
      const numSpinePoints = 26;
      const spineArcPositions = new Float32Array(numSpinePoints * 3);
      const spineArcGeo = new THREE.BufferGeometry();
      spineArcGeo.setAttribute('position', new THREE.BufferAttribute(spineArcPositions, 3));
      const spineArcMat = new THREE.LineBasicMaterial({
        color: 0xfff6d0,
        transparent: true,
        opacity: 0.90,
        blending: THREE.AdditiveBlending
      });
      const spineArcLine = new THREE.Line(spineArcGeo, spineArcMat);
      needleAssembly.add(spineArcLine);

      const numWingPoints = 14;
      const rWingArcGeo = new THREE.BufferGeometry();
      rWingArcGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(numWingPoints * 3), 3));
      const lWingArcGeo = new THREE.BufferGeometry();
      lWingArcGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(numWingPoints * 3), 3));
      const wingArcMat = new THREE.LineBasicMaterial({
        color: 0x7dd3fc,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const rWingArcLine = new THREE.Line(rWingArcGeo, wingArcMat);
      const lWingArcLine = new THREE.Line(lWingArcGeo, wingArcMat);
      needleAssembly.add(rWingArcLine);
      needleAssembly.add(lWingArcLine);

      function updateEnergyArcs(time) {
        const spineArr = spineArcGeo.attributes.position.array;
        for (let i = 0; i < numSpinePoints; i++) {
          const t = i / (numSpinePoints - 1);
          const y = (t * 9.8) - 4.9;
          const jitterX = (Math.random() - 0.5) * 0.06;
          const jitterZ = (Math.random() - 0.5) * 0.06;
          spineArr[i * 3 + 0] = Math.sin(time * 14 + y * 5) * 0.06 + jitterX;
          spineArr[i * 3 + 1] = y;
          spineArr[i * 3 + 2] = Math.cos(time * 12 + y * 4) * 0.06 + 0.10 + jitterZ;
        }
        spineArcGeo.attributes.position.needsUpdate = true;

        const rWingArr = rWingArcGeo.attributes.position.array;
        const lWingArr = lWingArcGeo.attributes.position.array;
        for (let i = 0; i < numWingPoints; i++) {
          const t = i / (numWingPoints - 1);
          const rx = t * 2.95;
          const ry = Math.sin(t * Math.PI) * 0.26 + (Math.random() - 0.5) * 0.07;
          rWingArr[i * 3 + 0] = rx;
          rWingArr[i * 3 + 1] = ry;
          rWingArr[i * 3 + 2] = 0.07;

          lWingArr[i * 3 + 0] = -rx;
          lWingArr[i * 3 + 1] = ry;
          lWingArr[i * 3 + 2] = 0.07;
        }
        rWingArcGeo.attributes.position.needsUpdate = true;
        lWingArcGeo.attributes.position.needsUpdate = true;
      }

      // 7. Ambient Particle Field
      const particleCount = 180;
      const partGeo = new THREE.BufferGeometry();
      const partPositions = new Float32Array(particleCount * 3);
      const partVelocities = [];

      for (let i = 0; i < particleCount; i++) {
        partPositions[i * 3 + 0] = (Math.random() - 0.5) * 16;
        partPositions[i * 3 + 1] = (Math.random() - 0.5) * 14;
        partPositions[i * 3 + 2] = (Math.random() - 0.5) * 8;

        partVelocities.push({
          x: (Math.random() - 0.5) * 0.008,
          y: (Math.random() - 0.5) * 0.012,
          z: (Math.random() - 0.5) * 0.008,
          baseY: partPositions[i * 3 + 1]
        });
      }

      partGeo.setAttribute('position', new THREE.BufferAttribute(partPositions, 3));
      const partMat = new THREE.PointsMaterial({
        color: 0xffd166,
        size: 0.10,
        transparent: true,
        opacity: 0.70,
        blending: THREE.AdditiveBlending
      });
      const particleSystem = new THREE.Points(partGeo, partMat);
      scene.add(particleSystem);

      // 8. Supernova Shockwaves Pool
      const shockwaves = [];
      const sparkParticles = [];

      function triggerShockwave(origin) {
        needleAssembly.updateMatrixWorld(true);
        const tipWorldPos = needleAssembly.localToWorld(new THREE.Vector3(0, 5.15, 0));
        const coreWorldPos = needleAssembly.localToWorld(new THREE.Vector3(0, 0, 0));

        // 1. Primary Gold Shockwave
        const ringGeo1 = new THREE.RingGeometry(0.2, 0.35, 64);
        const ringMat1 = new THREE.MeshBasicMaterial({
          color: currentColorTheme === 'gold' ? 0xffd166 : 0x38bdf8,
          transparent: true,
          opacity: 1.0,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending
        });
        const mesh1 = new THREE.Mesh(ringGeo1, ringMat1);
        mesh1.position.copy(tipWorldPos);
        mesh1.quaternion.copy(needleAssembly.quaternion);
        scene.add(mesh1);

        shockwaves.push({
          mesh: mesh1,
          scale: 1,
          opacity: 1,
          speed: 0.26
        });

        // 2. Secondary Refraction Halo from Core
        const ringGeo2 = new THREE.RingGeometry(0.3, 0.42, 64);
        const ringMat2 = new THREE.MeshBasicMaterial({
          color: currentColorTheme === 'gold' ? 0x67e8f9 : 0xffffff,
          transparent: true,
          opacity: 0.85,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending
        });
        const mesh2 = new THREE.Mesh(ringGeo2, ringMat2);
        mesh2.position.copy(coreWorldPos);
        mesh2.quaternion.copy(needleAssembly.quaternion);
        scene.add(mesh2);

        shockwaves.push({
          mesh: mesh2,
          scale: 0.8,
          opacity: 0.85,
          speed: 0.20
        });

        // 3. Starlight Spark Burst
        const numSparks = 20;
        for(let i = 0; i < numSparks; i++){
          const angle = (i / numSparks) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
          const speed = Math.random() * 3.4 + 1.8;
          const sparkMat = new THREE.SpriteMaterial({
            map: Math.random() > 0.35 ? starTextureGold : starTextureCyan,
            color: 0xffffff,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const sparkSprite = new THREE.Sprite(sparkMat);
          sparkSprite.position.copy(tipWorldPos);
          sparkSprite.scale.set(0.40, 0.40, 1);
          scene.add(sparkSprite);
          sparkParticles.push({
            sprite: sparkSprite,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            vz: (Math.random() - 0.5) * 1.2,
            opacity: 1.0
          });
        }

        tipFlare.scale.set(2.8, 2.8, 1);
        needleGlowLight.intensity = 7.0;

        playCelestialChime();
      }

      /* Web Audio Synthesizer (Procedural Pentatonic Celestial Chord) */
      let audioCtx = null;
      function playCelestialChime() {
        try {
          if (!audioCtx) {
            const AudioClass = window.AudioContext || window.webkitAudioContext;
            if (AudioClass) audioCtx = new AudioClass();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          if (!audioCtx) return;

          const now = audioCtx.currentTime;
          const freqs = [880, 1108.73, 1318.51, 1661.22, 1760];
          const masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(0.18, now);
          masterGain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
          masterGain.connect(audioCtx.destination);

          freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const voiceGain = audioCtx.createGain();
            osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.25);

            const vVol = 0.22 / (idx + 1);
            voiceGain.gain.setValueAtTime(vVol, now);
            voiceGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55 + idx * 0.05);

            osc.connect(voiceGain);
            voiceGain.connect(masterGain);

            osc.start(now + idx * 0.015);
            osc.stop(now + 0.65);
          });
        } catch (_e) {}
      }

      /* Mouse Cursor Tracking & 3D Aiming Engine */
      const mouse = {
        screenX: window.innerWidth / 2,
        screenY: window.innerHeight / 2,
        ndcX: 0,
        ndcY: 0,
        worldX: 0,
        worldY: 0,
        isDown: false
      };

      const needleState = {
        pos: new THREE.Vector3(0, 0, 0),
        targetPos: new THREE.Vector3(0, 0, 0),
        vel: new THREE.Vector3(0, 0, 0),
        currentQuat: new THREE.Quaternion(),
        targetQuat: new THREE.Quaternion()
      };

      function updateWorldMouseCoords(clientX, clientY) {
        mouse.screenX = clientX;
        mouse.screenY = clientY;
        mouse.ndcX = (clientX / window.innerWidth) * 2 - 1;
        mouse.ndcY = -(clientY / window.innerHeight) * 2 + 1;

        const vec = new THREE.Vector3(mouse.ndcX, mouse.ndcY, 0.5);
        vec.unproject(camera);
        vec.sub(camera.position).normalize();
        const distance = -camera.position.z / vec.z;
        const worldPos = camera.position.clone().add(vec.multiplyScalar(distance));

        mouse.worldX = worldPos.x;
        mouse.worldY = worldPos.y;

        if (telCoords) {
          telCoords.textContent = `${Math.round(clientX)}, ${Math.round(clientY)}`;
        }
      }

      window.addEventListener('pointermove', function (e) {
        updateWorldMouseCoords(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('pointerdown', function (e) {
        mouse.isDown = true;
        updateWorldMouseCoords(e.clientX, e.clientY);
        triggerShockwave(needleAssembly.position);
      });

      window.addEventListener('pointerup', function () {
        mouse.isDown = false;
      });

      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /* Main Animation & Physics Loop */
      let clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const time = clock.getElapsedTime();

        // 1. Aiming / Following Logic
        if (currentMode === 'aim') {
          needleState.targetPos.set(0, 0, 0);

          const targetDir = new THREE.Vector3(mouse.worldX, mouse.worldY, 0).sub(needleAssembly.position);
          targetDir.z = Math.min(2.5, Math.max(-2.5, targetDir.length() * 0.15));
          targetDir.normalize();

          const upVector = new THREE.Vector3(0, 1, 0);
          needleState.targetQuat.setFromUnitVectors(upVector, targetDir);

          needleState.targetPos.y += Math.sin(time * 2.2) * 0.12;

          needleAssembly.quaternion.slerp(needleState.targetQuat, 0.09);
          needleAssembly.position.lerp(needleState.targetPos, 0.08);

          const euler = new THREE.Euler().setFromQuaternion(needleAssembly.quaternion);
          if (telPitch) telPitch.textContent = `${(euler.x * 57.2958).toFixed(1)}°`;
          if (telYaw) telYaw.textContent = `${(euler.z * 57.2958).toFixed(1)}°`;

        } else if (currentMode === 'follow') {
          const offset = new THREE.Vector3(mouse.worldX, mouse.worldY, 0.5);
          needleState.targetPos.copy(offset);

          const moveDir = needleState.targetPos.clone().sub(needleAssembly.position);
          const speed = moveDir.length();
          moveDir.normalize();

          if (speed > 0.05) {
            needleState.targetQuat.setFromUnitVectors(new THREE.Vector3(0, 1, 0), moveDir);
            needleAssembly.quaternion.slerp(needleState.targetQuat, 0.1);
          }

          needleAssembly.position.lerp(needleState.targetPos, 0.12);
        }

        // 2. Pulse Novas & Shimmer
        starSprites.forEach(item => {
          const pulse = 1.0 + Math.sin(time * 4.2 + item.phase) * 0.22;
          item.sprite.scale.set(item.baseScale * pulse, item.baseScale * pulse, 1);
          item.sprite.material.rotation = Math.sin(time * 0.8 + item.phase) * 0.18;
        });

        // 3. Rotate Gimbal Rings & Core Diamond
        gimbalRing1.rotation.z += 0.022;
        gimbalRing1.rotation.x += 0.012;
        gimbalRing2.rotation.z -= 0.018;
        gimbalRing2.rotation.y += 0.015;
        gimbalRing3.rotation.y += 0.035;
        gimbalRing3.rotation.x += 0.024;

        outerDiamond.rotation.y += 0.028;
        outerDiamond.rotation.x += 0.014;
        innerDiamond.rotation.z -= 0.040;

        starGems.forEach(gem => {
          gem.rotation.y += 0.032;
        });
        rTipGem.rotation.y += 0.03;
        lTipGem.rotation.y -= 0.03;
        rBarbGem.rotation.x += 0.03;
        lBarbGem.rotation.x -= 0.03;

        // 4. Update Orbiting Celestial Satellites (Starlight Motes)
        motes.forEach(m => {
          m.angle += m.speed * delta;
          const mx = Math.cos(m.angle) * m.rx;
          const my = Math.sin(m.angle) * Math.cos(m.tilt) * m.ry;
          const mz = Math.sin(m.angle) * Math.sin(m.tilt) * m.rz + 0.10;
          m.sprite.position.set(mx, my, mz);
        });

        // 5. Dynamic Electrical Tendril Arcs
        updateEnergyArcs(time);

        // 6. Update Floating Background Particles
        const partPositions = particleSystem.geometry.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          partPositions[i * 3 + 1] += Math.sin(time + i) * 0.003;
          partPositions[i * 3 + 0] += Math.cos(time * 0.8 + i) * 0.002;
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;

        // 7. Expand Shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.scale += sw.speed;
          sw.opacity -= 0.035;
          sw.mesh.scale.set(sw.scale, sw.scale, sw.scale);
          sw.mesh.material.opacity = Math.max(0, sw.opacity);

          if (sw.opacity <= 0) {
            scene.remove(sw.mesh);
            sw.mesh.geometry.dispose();
            sw.mesh.material.dispose();
            shockwaves.splice(i, 1);
          }
        }

        // 8. Update Sparks
        for (let i = sparkParticles.length - 1; i >= 0; i--) {
          const sp = sparkParticles[i];
          sp.sprite.position.x += sp.vx * delta;
          sp.sprite.position.y += sp.vy * delta;
          sp.sprite.position.z += sp.vz * delta;
          sp.opacity -= delta * 2.5;
          sp.sprite.material.opacity = Math.max(0, sp.opacity);
          const s = Math.max(0.05, 0.40 * sp.opacity);
          sp.sprite.scale.set(s, s, 1);
          if (sp.opacity <= 0) {
            scene.remove(sp.sprite);
            sp.sprite.material.dispose();
            sparkParticles.splice(i, 1);
          }
        }

        // Relax Tip Flare & PointLight Intensity
        if (tipFlare.scale.x > 1.3) {
          const nextScale = Math.max(1.3, tipFlare.scale.x - delta * 3.8);
          tipFlare.scale.set(nextScale, nextScale, 1);
        }
        if (needleGlowLight.intensity > 3.8) {
          needleGlowLight.intensity = Math.max(3.8, needleGlowLight.intensity - delta * 6.0);
        }

        needleGlowLight.position.copy(needleAssembly.position);

        renderer.render(scene, camera);
      }

      animate();

      /* HUD Controls Interaction */
      const modeAimBtn = document.getElementById('modeAimBtn');
      const modeFollowBtn = document.getElementById('modeFollowBtn');
      const themeGoldBtn = document.getElementById('themeGoldBtn');
      const themeCyanBtn = document.getElementById('themeCyanBtn');

      function setMode(mode) {
        currentMode = mode;
        modeAimBtn.classList.toggle('active', mode === 'aim');
        modeFollowBtn.classList.toggle('active', mode === 'follow');
      }

      function setTheme(theme) {
        currentColorTheme = theme;
        themeGoldBtn.classList.toggle('active', theme === 'gold');
        themeCyanBtn.classList.toggle('active', theme === 'cyan');

        const palette = COLOR_PALETTES[theme];
        spineMat.color.setHex(palette.needle);
        spineMat.emissive.setHex(palette.needleEmissive);
        wingMat.color.setHex(palette.wings);
        wingMat.emissive.setHex(palette.wingEmissive);
        wingEdgeMat.color.setHex(palette.wingBevel);
        crystalWingMat.emissive.setHex(palette.crystalWing);
        ringMat1.color.setHex(palette.ring1);
        ringMat2.color.setHex(palette.ring2);
        needleGlowLight.color.setHex(palette.ring1);
        particleSystem.material.color.setHex(palette.spark);

        const tex = theme === 'gold' ? starTextureGold : starTextureCyan;
        starSprites.forEach(item => {
          item.sprite.material.map = tex;
          item.sprite.material.needsUpdate = true;
        });
        tipFlare.material.map = tex;
        tailFlare.material.map = tex;
      }

      modeAimBtn.addEventListener('click', () => setMode('aim'));
      modeFollowBtn.addEventListener('click', () => setMode('follow'));
      themeGoldBtn.addEventListener('click', () => setTheme('gold'));
      themeCyanBtn.addEventListener('click', () => setTheme('cyan'));

    })();
  </script>
</body>
</html>

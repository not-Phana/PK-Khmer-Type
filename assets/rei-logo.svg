<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- PK Khmer Type Rei — Official Tutor Crest Logo -->
  <defs>
    <!-- Dark Matte Obsidian Gradient Base -->
    <linearGradient id="reiBgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>

    <!-- Keycap Dish Recess Gradient -->
    <linearGradient id="reiWellGrad" x1="14" y1="14" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#0a0d18"/>
    </linearGradient>

    <!-- Outer Bezel Stroke Gradient -->
    <linearGradient id="reiBorderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a3652"/>
      <stop offset="60%" stop-color="#1a2236"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Radiant Imperial Gold Gradient -->
    <linearGradient id="reiGoldGrad" x1="26" y1="32" x2="102" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1aa"/>
      <stop offset="35%" stop-color="#ffd166"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Celestial Cyan Kinematic Accent Gradient -->
    <linearGradient id="reiCyanGrad" x1="24" y1="98" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Zen Enso Focus Ring Gradient -->
    <linearGradient id="reiZenRingGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#ffd166" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft Golden Aura Glow Filter -->
    <filter id="reiGoldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Dark Matte Obsidian Mechanical Keycap Base -->
  <rect width="128" height="128" rx="28" fill="url(#reiBgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="url(#reiBorderGrad)" stroke-width="2"/>

  <!-- 2. Switch Well Dish (Recessed Keycap Dish) -->
  <rect x="14" y="14" width="100" height="100" rx="20" fill="url(#reiWellGrad)" stroke="#1f293d" stroke-width="1.5"/>

  <!-- 3. Zen Enso Focus Ring (Symbolizing Rei / Focus / Mastery) -->
  <circle cx="64" cy="58" r="41" stroke="url(#reiZenRingGrad)" stroke-width="1.8" stroke-dasharray="195 72" stroke-linecap="round"/>

  <!-- 4. Precision Corner Registration Brackets -->
  <path d="M24 34 V24 H34" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M104 34 V24 H94" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M24 92 V102 H34" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M104 92 V102 H94" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 5. Central Hero Dual-Legend Monogram: Latin 'R' & Khmer 'រ' -->
  <g filter="url(#reiGoldGlow)">
    <!-- === LATIN LETTER 'R' (Matching PK Logo 8px Stroke Precision) === -->
    <!-- R Stem (Flush bounds x=28..36, y=34..88) -->
    <rect x="28" y="34" width="8" height="54" rx="4" fill="url(#reiGoldGrad)"/>
    <!-- R Upper Bowl -->
    <path d="M32 38 H46 C52 38 56 42.5 56 50 C56 57.5 52 61 46 61 H32" 
          stroke="url(#reiGoldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- R Kick Leg -->
    <path d="M44 61 L58 87" stroke="url(#reiGoldGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- === KHMER CONSONANT 'រ' (Ro / Rien / Rei) === -->
    <text x="84" y="82" 
          font-family="'Noto Serif Khmer', 'Khmer OS Battambang', 'Noto Sans Khmer', serif" 
          font-size="54" 
          font-weight="700" 
          fill="url(#reiGoldGrad)" 
          text-anchor="middle">រ</text>
  </g>

  <!-- 6. Tactile Home-Row Alignment Bar with Precision Focus Jewel -->
  <rect x="42" y="99" width="44" height="3.5" rx="1.75" fill="url(#reiCyanGrad)"/>
  <circle cx="64" cy="100.75" r="2.2" fill="#38bdf8"/>
  <circle cx="64" cy="100.75" r="0.9" fill="#ffffff"/>

  <!-- 7. Micro Inscription: REI · រៀន -->
  <text x="64" y="113" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="6.5" 
        font-weight="800" 
        letter-spacing="2" 
        fill="#ffd166" 
        text-anchor="middle" 
        opacity="0.85">REI · រៀន</text>
</svg>
